<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#eaf2ff"/>
      <stop offset="50%"  stop-color="#f5ebff"/>
      <stop offset="100%" stop-color="#ffe9f3"/>
    </linearGradient>
    <linearGradient id="flame" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%"   stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#bf5af2"/>
    </linearGradient>
  </defs>

  <!-- Soft pastel rounded square -->
  <rect width="32" height="32" rx="8" ry="8" fill="url(#bg)"/>

  <!-- Hairline flame outline in the brand gradient -->
  <path d="
    M16 6
    C 18.5 9.5, 22.5 11, 22 16.5
    C 22 21.5, 19 24.5, 16 24.5
    C 13 24.5, 10 21.5, 10 16.5
    C 9.5 11, 13.5 9.5, 16 6 Z"
    fill="none"
    stroke="url(#flame)"
    stroke-width="1.6"
    stroke-linejoin="round"/>

  <!-- Tiny inner dot — single warm accent for personality -->
  <circle cx="16" cy="17.5" r="2.2" fill="#ff9f0a" opacity="0.85"/>
</svg>
