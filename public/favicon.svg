<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#eaf2ff"/>
      <stop offset="50%"  stop-color="#f5ebff"/>
      <stop offset="100%" stop-color="#ffe9f3"/>
    </linearGradient>
    <linearGradient id="anvil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#525a6d"/>
      <stop offset="100%" stop-color="#1f242e"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7a8295"/>
      <stop offset="100%" stop-color="#363c47"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a87141"/>
      <stop offset="100%" stop-color="#5b3a1c"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#fff7c2"/>
      <stop offset="40%" stop-color="#ffd60a"/>
      <stop offset="100%" stop-color="#ff9f0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft pastel rounded square -->
  <rect width="32" height="32" rx="8" ry="8" fill="url(#bg)"/>

  <!-- Anvil — drop shadow behind it for depth -->
  <ellipse cx="16" cy="24.5" rx="11" ry="1.2" fill="rgba(20,25,35,0.18)"/>

  <!-- Anvil (slight -2° tilt for depth, not perfectly flat) -->
  <g transform="rotate(-2 16 19)">
    <path d="
      M3 16.5 L5 15 L27 15 L27 17.5 L21 17.5 L21 21
      L25.5 21 L25.5 23.5 L6.5 23.5 L6.5 21 L11 21
      L11 17.5 L5 17.5 Z"
      fill="url(#anvil)"
      stroke="#13171f" stroke-width="0.45"
      stroke-linejoin="round"/>
    <!-- Top working surface sheen -->
    <rect x="6.5" y="15.3" width="19" height="0.55" fill="rgba(255,255,255,0.4)" rx="0.3"/>
    <!-- Subtle base shadow -->
    <rect x="7" y="22.7" width="18" height="0.6" fill="rgba(0,0,0,0.25)" rx="0.3"/>
  </g>

  <!-- Hammer — diagonal, head on lower-left striking anvil -->
  <g transform="rotate(34 12 11)">
    <!-- Handle (wooden) -->
    <rect x="12" y="10.3" width="14" height="2.2"
          fill="url(#handle)"
          stroke="#3d2410" stroke-width="0.4"
          rx="0.9"/>
    <!-- Grip wraps near the end -->
    <rect x="22" y="10.3" width="0.4" height="2.2" fill="rgba(0,0,0,0.3)"/>
    <rect x="23.2" y="10.3" width="0.4" height="2.2" fill="rgba(0,0,0,0.3)"/>
    <rect x="24.4" y="10.3" width="0.4" height="2.2" fill="rgba(0,0,0,0.3)"/>

    <!-- Hammer head (iron block) -->
    <rect x="5" y="8" width="8" height="6.8"
          fill="url(#head)"
          stroke="#13171f" stroke-width="0.5"
          rx="1.1"/>
    <!-- Head top sheen -->
    <rect x="5.7" y="8.6" width="6.7" height="0.8" fill="rgba(255,255,255,0.32)" rx="0.4"/>
    <!-- Pin where handle enters head -->
    <circle cx="13" cy="11.4" r="0.5" fill="#1c2129"/>
  </g>

  <!-- Spark cluster at the impact point (where rotated head meets anvil) -->
  <circle cx="6.8" cy="14.5" r="2.2" fill="url(#spark)"/>
  <circle cx="6.8" cy="14.5" r="0.85" fill="#fff7c2"/>
  <!-- Tiny stray sparks flying off -->
  <circle cx="4.2" cy="12.3" r="0.45" fill="#ffd60a"/>
  <circle cx="3.5" cy="14.5" r="0.35" fill="#ff9f0a"/>
  <circle cx="9.2" cy="12" r="0.4" fill="#ffd60a"/>
</svg>
