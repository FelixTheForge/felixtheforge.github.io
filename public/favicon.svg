<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0071e3"/>
      <stop offset="60%" stop-color="#5e5ce6"/>
      <stop offset="100%" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="flame" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%"  stop-color="#ff9f0a"/>
      <stop offset="55%" stop-color="#ffd60a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Rounded gradient square (works on light & dark tabs) -->
  <rect width="32" height="32" rx="8" ry="8" fill="url(#bg)"/>

  <!-- Stylized flame -->
  <path d="
    M16 5.5
    C 18.5 9.5, 23 11, 22.5 16.5
    C 22.5 21.5, 19 25, 16 25
    C 13 25, 9.5 21.5, 9.5 16.5
    C 9 11, 13.5 9.5, 16 5.5 Z
    M 16 12
    C 17.5 14.5, 19 16, 19 19
    C 19 21, 17.5 22.5, 16 22.5
    C 14.5 22.5, 13 21, 13 19
    C 13 16, 14.5 14.5, 16 12 Z"
    fill="url(#flame)" fill-rule="evenodd"/>
</svg>
