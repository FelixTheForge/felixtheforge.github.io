<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#eaf2ff"/>
      <stop offset="50%"  stop-color="#f5ebff"/>
      <stop offset="100%" stop-color="#ffe9f3"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7a8295"/>
      <stop offset="100%" stop-color="#363c47"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a87141"/>
      <stop offset="100%" stop-color="#5b3a1c"/>
    </linearGradient>
  </defs>

  <!-- Soft pastel rounded background -->
  <rect width="32" height="32" rx="8" ry="8" fill="url(#bg)"/>

  <!-- Diagonal forging hammer: head bottom-left → handle top-right -->
  <g transform="rotate(-35 16 16)">
    <!-- Wooden handle -->
    <rect x="15" y="14.3" width="14" height="3.4"
          fill="url(#handle)"
          stroke="#3d2410" stroke-width="0.5"
          rx="1.2"/>
    <!-- Grip wrap rings near the bottom of the handle -->
    <rect x="24" y="14.3" width="0.6" height="3.4" fill="rgba(0,0,0,0.32)"/>
    <rect x="25.4" y="14.3" width="0.6" height="3.4" fill="rgba(0,0,0,0.32)"/>
    <rect x="26.8" y="14.3" width="0.6" height="3.4" fill="rgba(0,0,0,0.32)"/>
    <!-- End cap -->
    <rect x="28" y="13.8" width="1" height="4.4" fill="#3d2410" rx="0.3"/>

    <!-- Hammer head (iron block) -->
    <rect x="2.5" y="10.5" width="11" height="11"
          fill="url(#head)"
          stroke="#13171f" stroke-width="0.55"
          rx="1.6"/>
    <!-- Top sheen on the iron -->
    <rect x="3.4" y="11.3" width="9.2" height="1.3" fill="rgba(255,255,255,0.38)" rx="0.6"/>
    <!-- Pin where handle enters head -->
    <circle cx="13.6" cy="16" r="0.7" fill="#1c2129"/>
    <!-- Faint cleft (head shaping mark) -->
    <line x1="6.5" y1="13" x2="6.5" y2="19" stroke="rgba(0,0,0,0.18)" stroke-width="0.4"/>
  </g>
</svg>
